manifest {
    name = "ARRAN"
    author = "Corentin Molitor"
    homePage = "https://github.com/HCL-HUBL/ARRAN"
    description = "Nextflow to perform GWAS and RVAT analyses"
    mainScript = "ARRAN.nf"
    version = "0.5.0"
    nextflowVersion = "24+"
}

executor {
    name = 'local'
    cpus = 25
    memory = "100GB"
}

singularity {
	enabled = true
}

process {
    container = "${projectDir}/HCL-GWAS_20250507-140149.simg"
}

params {
    // General options:
    plink_fileset = "${projectDir}/test_dataset/arran.{bed,bim,fam}"    
    covar_file    = "${projectDir}/test_dataset/arran.covars"      // Path to file listing the covariates to be included in the model
    annot_file    = "${projectDir}/data/snp129.tsv"  // (optional) path to the SNP annotations (format: "SNP annotation", space delimited)
    genome_build  = "hg19"                           // Accepts 'hg19' or 'hg38': used to define the genes list and PAR regions to use
    trait_type    = "binary"                         // Trait type: must be 'binary' or 'quantitative'

    // Output options:
    out_basename  = "arran_test"                          // Basename of the output files
    outdir        = "${projectDir}/test_dataset/arran_test_out/"                   // Path to the output folder

    // QC options:
    qc_mind       = 0.05                   // Individuals with missing genotypes > 'qc_mind' will be removed
    qc_geno       = 0.05                   // Variants with missing genotypes > 'qc_geno' will be removed
    qc_remove     = ""                     // (optional) File listing IIDs and FIDs of individuals to be excluded
    qc_hetfilter  = "both"                 // Heterozygosity filter, must be "none", "low", "high" or "both", cf: ./bin/het_check.R
    qc_hwe        = 5e-5                   // Variants with a HWE exact test p-value < 'qc_hwe' will be flagged (added to a file for further inspection) 

    // Pruning options:
    pr_window     = 200                    // Window size for the pruning, in number of variants
    pr_step       = 50                     // Window sliding size in number of variants
    pr_r2         = 0.25                   // Pairs of variants with r2 > 'pr_r2' will be removed

    makeGRM       = false

    // GWAS + XWAS options:
    run_GWAS      = true                   // Boolean indicating whether to run the GWAS analysis or not 
    run_XWAS      = true                   // Boolean indicating whether to run the XWAS analysis or not 
    gwas_maf      = 0.01                   // Variants with a MAF < 'qc_maf' will be removed for the GWAS analysis
    saige_covar   = "POP,PC1,PC2"      // List of all covariates to include in the model
    saige_qcovar  = "POP"                  // List indicating which covariates are categorical
    xwas_alpha    = 0.05                   // Significance for the X-specific QC steps (bonferroni correction will be applied to this)
    xwas_covar    = "POP,PC1,PC2"          // Covariates for the chrX analysis with XWAS

    // RVAT options:
    run_RVAT        = true                 // Boolean indicating whether to run the Rare Variants analysis or not
    saige_annot     = "frameshift:nonsense,frameshift:nonsense:missense:splice"                   // How to test the annotations, eg "lof,lof:missense,lof:missense:synonymous" (see annotation_in_groupTest in SAIGE for more details)
    saige_regions   = "${projectDir}/test_dataset/regions.bed"                   // (optional) list of regions to analyse (bed format)
    saige_extension = 5                    // When assigning SNPs to genes, extends the gene bounds by this many kbp (default 5)

    // Admixture:
    run_admixture   = false                // Boolean indicating whether to run Admixture
    admixture_K     = 2                    // Number of expected populations in the dataset

    tools {
        plink = "/opt/progrs/plink"
        admixture = "/opt/progrs/dist/admixture_linux-1.3.0/admixture"
        R = "R"
        Rscript = "Rscript"
        saige_folder = "/usr/local/bin/"  // Folder where 'step1_fitNULLGLMM.R', 'step2_SPAtests.R' and 'createSparseGRM.R' are located
        xwas = "/opt/progrs/xwas-3.0-master/bin/xwas"
    }
}
